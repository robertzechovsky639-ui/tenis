name: Denní aktualizace dat a nasazení

on:
  schedule:
    - cron: '17 3 * * *'    # 05:17 letního času v Praze (04:17 v zimě)
    - cron: '17 15 * * *'   # 17:17 letního času v Praze (16:17 v zimě)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    shell: bash   # = bash -eo pipefail (chyba daily.py se neschová za | tee)

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Europe/Prague
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalace závislostí
        run: pip install -r requirements-ci.txt
      - name: Stažení nových výsledků a rozpisu + aktualizace ratingů (bez přetrénování)
        run: python scripts/daily.py 2>&1 | tee update.log
      - name: Kontrola dat a parity JS == Python
        run: |
          python scripts/check_data.py
          node scripts/parity_test.js
      - name: Sestavení webu
        run: bash scripts/make_dist.sh
      - name: Commit aktualizovaného stavu
        id: commit_state
        continue-on-error: true
        run: |
          # Živé učení commituje state/live_*.json každých pár minut.
          # Rebase konflikt dřív shodil celý job, takže se nenasadil ani dist.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "Stav beze změn"
            exit 0
          fi
          git commit -q -m "Denní aktualizace dat $(date '+%Y-%m-%d %H:%M %Z')"
          resolve_conflicts() {
            local f
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                state/live_online.json|state/online.json|state/live_preds.json)
                  # průběžné živé váhy necháme z main
                  git checkout --ours -- "$f"
                  ;;
                *)
                  # denní export (hráči, turnaje, train_new, …) bereme z denního commitu
                  git checkout --theirs -- "$f"
                  ;;
              esac
              git add -- "$f"
            done
          }
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "push ok (pokus $i)"
                exit 0
              fi
              echo "push race, pokus $i"
            else
              echo "rebase konflikt, řeším (pokus $i)"
              resolve_conflicts
              while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
                resolve_conflicts
                if ! GIT_EDITOR=true git rebase --continue; then
                  if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                    if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                      echo "rebase continue selhal bez konfliktů"
                      git rebase --abort || true
                      break
                    fi
                    continue
                  fi
                  break
                fi
              done
              if git push origin HEAD:main; then
                echo "push ok po resolve (pokus $i)"
                exit 0
              fi
            fi
            sleep $((i * 2))
          done
          echo "commit/push stavu selhal, dist se i tak nasadí" >&2
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
